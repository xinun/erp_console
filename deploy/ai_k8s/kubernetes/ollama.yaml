apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "ai-ollama-pvc-2"
  namespace: "ai"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: "ai-ollama-storage"
      automountServiceAccountToken: false
      restartPolicy: "Never"
      containers:
        -
          name: "prepare-pvc"
          image: "python:3.12-slim"
          command:
            - "python"
            - "-B"
            - "/storage/prepare_pvc.py"
          env:
            -
              name: "PVC_NAME"
              value: "ai-models"
            -
              name: "STORAGE_CLASS"
              value: "accordion-storage"
            -
              name: "STORAGE_SIZE"
              value: "20Gi"
            -
              name: "TOKEN_SECRET"
              value: "ai-api-token"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          volumeMounts:
            -
              name: "storage-code"
              mountPath: "/storage"
              readOnly: true
            -
              name: "storage-auth"
              mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
              readOnly: true
      volumes:
        -
          name: "storage-code"
          configMap:
            name: "ai-ollama-storage-2"
        -
          name: "storage-auth"
          projected:
            sources:
              -
                serviceAccountToken:
                  path: "token"
                  expirationSeconds: 3600
              -
                configMap:
                  name: "kube-root-ca.crt"
                  items:
                    -
                      key: "ca.crt"
                      path: "ca.crt"
              -
                downwardAPI:
                  items:
                    -
                      path: "namespace"
                      fieldRef:
                        fieldPath: "metadata.namespace"
