                      - "-c"
                      - |
                        set -eu
                        ollama serve &
                        server_pid=$!
                        trap 'kill "$server_pid" 2>/dev/null || true' EXIT INT TERM
                        n=0
                        until ollama list >/dev/null 2>&1; do
                          n=$((n+1)); [ "$n" -lt 60 ] || exit 1
                          sleep 2
                        done
                        ollama pull "$MODEL_NAME"
                        kill "$server_pid"
                        wait "$server_pid" || true
                        trap - EXIT INT TERM
                    env:
                      -
                        name: "MODEL_NAME"
                        value: "{{.values.model}}"
                      -
                        name: "OLLAMA_HOST"
                        value: "127.0.0.1:11434"
                      -
                        name: "OLLAMA_MODELS"
                        value: "/models"
                      -
                        name: "OLLAMA_NO_CLOUD"
                        value: "1"
                      -
                        name: "OLLAMA_NUM_PARALLEL"
                        value: "1"
                      -
                        name: "OLLAMA_MAX_LOADED_MODELS"
                        value: "1"
                      -
                        name: "OLLAMA_MAX_QUEUE"
                        value: "1"
                      -
                        name: "OLLAMA_CONTEXT_LENGTH"
                        value: "4096"
                    resources:
                      requests:
                        cpu: "{{.values.cpuRequest}}"
                        memory: "{{.values.memoryRequest}}"
                      limits:
                        cpu: "{{.values.cpuLimit}}"
                        memory: "{{.values.memoryLimit}}"
                    volumeMounts:
                      -
                        name: "models"
                        mountPath: "/models"
                containers:
                  -
                    name: "ollama"
                    image: "{{.values.ollamaImage}}"
                    args:
                      - "serve"
                    env:
                      -
                        name: "MODEL_NAME"
                        value: "{{.values.model}}"
                      -
                        name: "OLLAMA_HOST"
                        value: "127.0.0.1:11434"
                      -
                        name: "OLLAMA_MODELS"
                        value: "/models"
                      -
                        name: "OLLAMA_NO_CLOUD"
                        value: "1"
                      -
                        name: "OLLAMA_NUM_PARALLEL"
                        value: "1"
                      -
                        name: "OLLAMA_MAX_LOADED_MODELS"
                        value: "1"
                      -
                        name: "OLLAMA_MAX_QUEUE"
                        value: "1"
                      -
                        name: "OLLAMA_CONTEXT_LENGTH"
                        value: "4096"
                    resources:
                      requests:
                        cpu: "{{.values.cpuRequest}}"
                        memory: "{{.values.memoryRequest}}"
                      limits:
                        cpu: "{{.values.cpuLimit}}"
                        memory: "{{.values.memoryLimit}}"
                    volumeMounts:
                      -
                        name: "models"
                        mountPath: "/models"
                    readinessProbe:
                      exec:
                        command:
                          - "ollama"
                          - "list"
                      periodSeconds: 10
                      timeoutSeconds: 5
                  -
                    name: "gateway"
                    image: "{{.values.gatewayImage}}"
                    command:
                      - "python"
                      - "-B"
                      - "/app/gateway.py"
                    env:
                      -
                        name: "MODEL_NAME"
                        value: "{{.values.model}}"
                    ports:
                      -
                        name: "http"
                        containerPort: 8080
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 10001
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - "ALL"
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "64Mi"
                      limits:
                        cpu: "500m"
                        memory: "256Mi"
                    volumeMounts:
                      -
                        name: "code"
                        mountPath: "/app"
                        readOnly: true
                      -
                        name: "auth"
                        mountPath: "/auth"
                        readOnly: true
                    readinessProbe:
                      httpGet:
                        path: "/readyz"
                        port: "http"
                      timeoutSeconds: 5
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: "/healthz"
                        port: "http"
                      initialDelaySeconds: 10
                      timeoutSeconds: 3
                volumes:
                  -
                    name: "models"
                    persistentVolumeClaim:
                      claimName: "{{.values.pvcName}}"
                  -
                    name: "code"
                    configMap:
