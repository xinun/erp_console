                      requests:
                        cpu: "{{.values.cpuRequest}}"
                        memory: "{{.values.memoryRequest}}"
                      limits:
                        cpu: "{{.values.cpuLimit}}"
                        memory: "{{.values.memoryLimit}}"
                    volumeMounts:
                      -
                        name: "models"
                        mountPath: "/models"
                containers:
