      ===== 배포 전 확인
      * 카탈로그 형식: `ClusterCatalogTemplate`
      * 패키지 라벨: `packageName: ai-ollama`, `version: "3.1.0"`
      * 템플릿에 클러스터·namespace를 고정하지 않습니다. 배포 화면에서 대상 클러스터와 namespace를 선택하고 실제 적용 결과를 확인합니다.
      * 노드의 예약 가능한 CPU·메모리, taint, StorageClass와 NodePort 접근 경로를 확인합니다.
      * 배포 후보 노드는 컨테이너 이미지와 Ollama 모델 다운로드 경로에 접근할 수 있어야 합니다.
      * 준비 계정의 Role/RoleBinding 생성 권한이 필요합니다.
      * 일반 Kubernetes에서도 표준 YAML로 배포할 수 있습니다.

      ===== 자동 준비와 시작 순서
      . Job이 PVC를 조회하고 없으면 지정 StorageClass·용량으로 생성합니다.
      . 기존 PVC는 클래스·용량·접근 모드·상태를 확인하고 조건 불일치 시 실패합니다.
      . Secret이 없으면 보안 난수 32바이트를 64자리 토큰으로 생성해 `token` 키에 저장합니다.
      . 기존 Secret은 검증 후 유지하며 잘못된 토큰을 임의로 덮어쓰지 않습니다.
      . AI Pod가 볼륨을 마운트하고 PVC 조건을 다시 검사합니다.
      . 모델 다운로드·검증이 완료되면 Ollama와 게이트웨이를 시작합니다.

      준비 중 `PVC not found` 또는 `Secret not found` 이벤트가 잠시 발생할 수 있습니다.
      지속되면 준비 Job 로그를 확인합니다. `WaitForFirstConsumer`의 PVC Pending은 Pod 배치 전 정상일 수 있습니다.


      ==== 사용 방법
      명령의 `ai`는 namespace, `ai-ollama`는 배포 이름 예시입니다. 실제 배포 값으로 바꿉니다.

      ===== 터미널 대화
      [source,bash]
      ----
      kubectl -n ai exec -it deployment/ai-ollama -c ollama -- ollama run qwen3:8b
      ----

      `/bye`로 종료합니다. Kubernetes exec 권한이 필요하며 게이트웨이 API 토큰은 사용하지 않습니다.
      터미널 호출은 게이트웨이의 동시 요청 제한을 거치지 않아 API와 동시에 사용하면 자원을 경쟁합니다.

      ===== VPN 내 API 호출
      노드 IP와 실제 할당된 NodePort에 접근 가능한 PC·서버에서 사용합니다.
      같은 클러스터에서는 `http://ai-ollama.ai.svc:8080/api/chat` 주소도 사용할 수 있습니다.
      아래 토큰 조회는 Secret 조회 권한이 있는 관리자 터미널에서 실행합니다.

      [source,bash]
      ----
      AI_TOKEN="$(kubectl -n ai get secret ai-api-token -o jsonpath='{.data.token}' | base64 --decode)"
      NODE_PORT="$(kubectl -n ai get svc ai-ollama -o jsonpath='{.spec.ports[0].nodePort}')"
      curl --max-time 200 "http://<노드IP>:${NODE_PORT}/api/chat" \
        -H "Authorization: Bearer ${AI_TOKEN}" \
        -H 'Content-Type: application/json' \
        -d '{"messages":[{"role":"user","content":"한국어로 짧게 인사해줘."}]}'
      unset AI_TOKEN NODE_PORT
      ----

      기존 Service를 갱신하면 일반적으로 할당 포트가 유지됩니다. Service 삭제 후 다시 생성하면 포트가 바뀔 수 있습니다.
      API 토큰은 사용할 백엔드의 비밀 설정에 저장합니다. 브라우저 코드·Git·공개 로그에 넣지 않습니다.
      NodePort는 HTTP입니다. 인터넷 연결에는 외부 통신 경로와 HTTPS 프록시 및 요청 제한을 별도로 구성합니다.

      ==== 재배포 및 모델 변경
      * 같은 PVC·Secret 이름을 유지하면 모델 파일과 API 토큰을 재사용합니다.
      * 모델명을 변경하면 새 모델을 준비합니다. 기존 모델 파일은 PVC에 남습니다.
      * 준비 코드·Python 이미지·PVC/Secret 설정 변경 또는 Job 실패 재시도 시 `storageRevision`을 증가시킵니다.
      * 완료된 동일 Job은 Apply만으로 재실행되지 않습니다. 삭제된 PVC·Secret 복구에도 새 준비 버전을 사용합니다.
      * 게이트웨이 코드만 변경하면 Pod 재시작이 필요합니다.
      * `Recreate` 업데이트 중 서비스가 중단됩니다.
      * 독립적인 배포는 namespace 또는 PVC·Secret 이름을 분리하고 NodePort는 Service별로 자동 할당됩니다.

      ==== 권한 및 데이터 보존
      * 준비 Job은 지정 PVC·Secret 조회와 같은 namespace 내 생성 권한을 가집니다. 수정·삭제 권한은 없습니다.
      * Kubernetes RBAC의 생성 권한은 특정 리소스 이름으로 제한할 수 없습니다.
      * 시작 전 검사 계정은 지정 PVC 조회만 허용합니다.
      * Ollama와 게이트웨이에는 Kubernetes ServiceAccount 토큰을 마운트하지 않습니다.
      * Job이 생성한 PVC·Secret에는 ownerReferences를 부여하지 않습니다.
      * 일반 Kubernetes의 앱 YAML 삭제에는 PVC·Secret이 포함되지 않습니다. Accordion 자체 정리 정책은 확인이 필요합니다.
      * namespace 또는 PVC·Secret 직접 삭제는 별개이며 PV의 reclaimPolicy를 확인합니다.
spec:
  deployStrategy:
    defaultPolicy: Apply
    image:
      archiveCount: 5
      registryName: user-registry
  resourceValues:
    - name: ai-ollama
      values: {"ollamaImage": "ollama/ollama:0.34.2", "gatewayImage": "python:3.12-slim", "model": "qwen3:8b", "pvcName": "ai-models", "tokenSecret": "ai-api-token", "cpuRequest": "1", "cpuLimit": "3", "memoryRequest": "7Gi", "memoryLimit": "9Gi", "storageClass": "accordion-storage", "storageSize": "20Gi", "storageRevision": "2"}
  template:
    resources:
      - name: ai-ollama
        policy: Apply
        spec: |
          apiVersion: "v1"
          kind: "ConfigMap"
          metadata:
            name: "{{{.CATALOG.NAME}}}-storage-{{.values.storageRevision}}"
          data:
            prepare_pvc.py: |
              """Create an absent claim, or validate without mutating an existing claim."""
              import json
              import base64
              import secrets
              import os
              import re
              import ssl
              import sys
              from decimal import Decimal
              from pathlib import Path
              from urllib import request, error, parse


              def quantity(text):
                  match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([EPTGMK]i|[EPTGMk]|[eE][+-]?[0-9]+)?", text)
                  if not match:
                      raise ValueError("Unsupported storage quantity")
                  number, suffix = match.groups()
                  factor = {"": 1, **{p + "i": 1024 ** n for n, p in enumerate("KMGTPE", 1)},
                            **{p: 1000 ** n for n, p in enumerate("kMGTPE", 1)}}
                  if suffix and re.fullmatch(r"[eE][+-]?[0-9]+", suffix):
                      multiplier = Decimal(10) ** int(suffix[1:])
                  else:
                      multiplier = factor[suffix or ""]
                  return Decimal(number) * multiplier


              def validate(pvc, storage_class, size):
                  spec = pvc["spec"]
                  if pvc.get("metadata", {}).get("deletionTimestamp"):
                      raise ValueError("PVC is being deleted")
                  if pvc.get("status", {}).get("phase") == "Lost":
                      raise ValueError("PVC is Lost")
                  if spec.get("storageClassName") != storage_class:
                      raise ValueError("PVC StorageClass does not match")
                  if spec.get("volumeMode", "Filesystem") != "Filesystem":
                      raise ValueError("PVC must use Filesystem volumeMode")
                  if "ReadWriteOnce" not in spec.get("accessModes", []):
                      raise ValueError("PVC must support ReadWriteOnce")
                  if quantity(spec["resources"]["requests"]["storage"]) < quantity(size):
                      raise ValueError("PVC is smaller than requested; resize separately")


              def ensure(api, name, storage_class, size, create=True):
                  path = "/" + parse.quote(name, safe="")
                  try:
                      pvc = api("GET", path)
                  except error.HTTPError as exc:
                      if exc.code != 404 or not create:
                          raise
                      body = {"apiVersion": "v1", "kind": "PersistentVolumeClaim", "metadata": {"name": name},
                              "spec": {"accessModes": ["ReadWriteOnce"], "volumeMode": "Filesystem",
                                       "storageClassName": storage_class,
                                       "resources": {"requests": {"storage": size}}}}
                      try:
                          pvc = api("POST", "", body)
                      except error.HTTPError as conflict:
                          if conflict.code != 409:
                              raise
                          pvc = api("GET", path)
                  validate(pvc, storage_class, size)


              def main():
                  name, storage_class, size = (os.environ[k] for k in ("PVC_NAME", "STORAGE_CLASS", "STORAGE_SIZE"))
                  for setting in (name, storage_class):
                      if len(setting) > 253 or not re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", setting):
                          raise ValueError("PVC_NAME and STORAGE_CLASS must be valid names; replace CHANGE-ME")
                  if quantity(size) <= 0:
                      raise ValueError("Storage size must be positive")
                  auth = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                  namespace = (auth / "namespace").read_text().strip()
                  base = "https://kubernetes.default.svc/api/v1/namespaces/" + parse.quote(namespace, safe="")
                  opener = request.build_opener(request.ProxyHandler({}), request.HTTPSHandler(context=ssl.create_default_context(cafile=str(auth / "ca.crt"))))

                  def api(method, path, body=None):
                      req = request.Request(base + path, method=method, data=json.dumps(body).encode() if body else None,
                                            headers={"Authorization": "Bearer " + (auth / "token").read_text().strip(),
                                                     "Content-Type": "application/json"})
                      with opener.open(req, timeout=20) as response:
                          return json.load(response)

                  ensure(lambda method, path, body=None: api(method, "/persistentvolumeclaims" + path, body),
                         name, storage_class, size, create="--check-only" not in sys.argv)
                  print("PVC checked successfully", flush=True)
                  if "--check-only" not in sys.argv:
                      ensure_secret(lambda method, path, body=None: api(method, "/secrets" + path, body), os.environ["TOKEN_SECRET"])
                      print("API token Secret checked successfully (token not logged)", flush=True)


              def ensure_secret(api, name):
                  if len(name) > 253 or not re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", name):
                      raise ValueError("Invalid TOKEN_SECRET name")
                  path = "/" + parse.quote(name, safe="")
                  try:
                      obj = api("GET", path)
                  except error.HTTPError as exc:
                      if exc.code != 404:
                          raise
                      token = secrets.token_hex(32)
                      body = {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": name}, "type": "Opaque",
                              "data": {"token": base64.b64encode(token.encode()).decode()}}
                      try:
                          obj = api("POST", "", body)
                      except error.HTTPError as conflict:
                          if conflict.code != 409:
                              raise
                          obj = api("GET", path)
                  if obj.get("metadata", {}).get("deletionTimestamp"):
                      raise ValueError("Token Secret is being deleted")
                  try:
                      token = base64.b64decode(obj.get("data", {}).get("token", ""), validate=True).decode("utf-8").strip()
                  except (ValueError, UnicodeError):
                      raise ValueError("Existing Secret token is invalid; repair explicitly") from None
                  if len(token) < 32 or not token.isascii() or any(ch.isspace() for ch in token):
                      raise ValueError("Existing Secret needs a token of at least 32 ASCII characters without whitespace; not overwritten")


              if __name__ == "__main__":
                  try:
                      main()
                  except error.HTTPError as exc:
                      print("Kubernetes API error: HTTP", exc.code, file=sys.stderr)
                      sys.exit(1)
                  except Exception as exc:
                      print("PVC preparation failed:", str(exc), file=sys.stderr)
                      sys.exit(1)
